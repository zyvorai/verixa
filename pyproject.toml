[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verixa"
version = "0.1.0"
description = "Stateful AI agent rehearsal and outcome verification"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Zyvor AI Labs"}]
dependencies = []

[project.scripts]
verixa = "verixa.__main__:main"

[tool.setuptools.packages.find]
include = ["verixa*"]

[tool.setuptools.package-data]
verixa = ["static/*"]
