name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: node tests/console.cjs
      - run: python -m verixa --db /tmp/verixa-ci.db run all --junit artifacts/reference.xml
      - run: pip install --no-deps .
      - run: verixa --db /tmp/verixa-installed.db list
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.python }}
          path: artifacts/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t verixa:ci .
      - run: docker run --rm verixa:ci python3 -m verixa --db /tmp/test.db run all
